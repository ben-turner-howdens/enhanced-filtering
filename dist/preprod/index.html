<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enhanced Filtering</title>
    <link rel="stylesheet" href="../dist/css/styles.css" />
  <style>
body,main{font-family:Rooster,sans-serif!important;background-color:#f5f5f5}h1{text-align:center;font-size:26px;font-weight:700;line-height:1.2;margin-bottom:16px}.filter-wrapper{display:flex;flex-direction:row;justify-content:safe center;max-width:1400px;margin:0 auto;gap:8px;overflow-x:auto;padding:0 16px 12px;scroll-snap-type:x mandatory;scroll-padding-inline:max(16px,50% - 75px);scrollbar-width:thin;cursor:grab;touch-action:pan-y;-webkit-overflow-scrolling:touch}.filter-wrapper.is-dragging{cursor:grabbing;scroll-snap-type:none;user-select:none}.filter-wrapper__item{flex:0 0 150px;scroll-snap-align:center;text-align:center;padding:0 4px}.filter-wrapper__item img{width:150px;border-radius:50%}.filter-wrapper__item a,.filter-wrapper__item p{color:#000;text-decoration:none}.filter-wrapper__item a:hover{text-decoration:underline}.filter-wrapper__item p{font-size:16px;margin-top:4px}@media (min-width:1240px){.filter-wrapper{padding-right:0;padding-left:0}}
</style>
</head>
