<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Filtering</title>
  <link rel="stylesheet" href="../dist/css/styles.css" />
</head>

<body>
  <main>
    <div class="advanced_filters" aria-label="Filter options carousel">
      <div class="advanced_filters__viewport">
        <div class="advanced_filters__wrapper" aria-label="Filter options">
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Black" aria-label="Door Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/door_hinges.png" alt="Door Hinges" /></span>
              <p>Door Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Black" aria-label="Cabinet Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/cabinet_hinges.png" alt="Cabinet Hinges" /></span>
              <p>Cabinet Hinges</p>
            </a>
          </div><div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Black" aria-label="Black Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/black_hinges.png" alt="Black Hinges" /></span>
              <p>Black Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Brass" aria-label="Brass Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/brass_door_hinges_300x300.png" alt="Brass Hinges" /></span>
              <p>Brass Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?fire_rated=Fire_Rated" aria-label="Fire Rated Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/fire_rated_hinges.png" alt="Fire Rated Hinges" /></span>
              <p>Fire Rated Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?product_type=Butt_Hinge" aria-label="Butt Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/butt_hinges.png" alt="Butt Hinges" /></span>
              <p>Butt Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Chrome" aria-label="Chrome Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/chrome_hinges.png" alt="Chrome Hinges" /></span>
              <p>Chrome Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?length=102mm" aria-label="102mm Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/102mm_hinges" alt="102mm Hinges" /></span>
              <p>102mm Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?colour=Nickel" aria-label="Nickel Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/nickel_hinges.png" alt="Nickel Hinges" /></span>
              <p>Nickel Hinges</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/hinges?hinge_sub_product_type=Ball_Bearing" aria-label="Ball Bearing Hinges">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/hinges/images/ball_bearing_hinges.png" alt="Ball Bearing Hinges" /></span>
              <p>Ball Bearing Hinges</p>
            </a>
          </div>
        </div>
        <div class="advanced_filters__arrows">
          <button type="button" class="advanced_filters__arrow advanced_filters__arrow--next" aria-label="Scroll filter options forward">
            <img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/forward-ico" alt="Arrow" />
          </button>
          <button type="button" class="advanced_filters__arrow advanced_filters__arrow--prev" aria-label="Scroll filter options backward">
            <img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/forward-ico" alt="Arrow" />
          </button>
        </div>
      </div>
      <div class="advanced_filters__scrollbar-container">
        <div class="advanced_filters__scrollbar"></div>
      </div>
    </div>
  </main>

  <script src="./script.js" defer></script>
</body>

</html>
