<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enhanced Filtering</title>
  <link rel="stylesheet" href="../dist/css/styles.css" />
</head>

<body>
  <main>
    <div class="advanced_filters" aria-label="Filter options carousel">
      <div class="advanced_filters__viewport">
        <div class="advanced_filters__wrapper" aria-label="Filter options">
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles/door-handles" aria-label="Internal Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_door-handles.png" alt="Internal Handles" /></span>
              <p>Door Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles/cabinet-handles" aria-label="Internal Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_cabinet-handles.png" alt="Internal Handles" /></span>
              <p>Cabinet Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?handle_location=Internal" aria-label="Internal Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_internal-handles.png" alt="Internal Handles" /></span>
              <p>Internal Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?colour=Black" aria-label="Black Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_black-handles.png" alt="Black Handles" /></span>
              <p>Black Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?colour=Brass" aria-label="Brass Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_brass-handles.png" alt="Brass Handles" /></span>
              <p>Brass Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?colour=Chrome" aria-label="Chrome Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_chrome-handles.png" alt="Chrome Handles" /></span>
              <p>Chrome Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?finish=Brushed" aria-label="Brushed Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_brushed-handles.png" alt="Brushed Handles" /></span>
              <p>Brushed Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?colour=Brass&room_suitability=Kitchen" aria-label="Brass Kitchen Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_brass-kitchen-handles.png" alt="Brass Kitchen Handles" /></span>
              <p>Brass Kitchen Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?brand=Fuller_and_Forge" aria-label="Fuller &amp; Forge Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_fuller-and-forge-handles.png" alt="Fuller & Forge Handles" /></span>
              <p>Fuller &amp; Forge Handles</p>
            </a>
          </div>
          <div class="advanced_filters__item">
            <a href="/hardware/screws-and-ironmongery/handles?finish=Satin" aria-label="Satin Handles">
              <span class="advanced_filters__image"><img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/handle-images/AF_satin-handles.png" alt="Satin Handles" /></span>
              <p>Satin Handles</p>
            </a>
          </div>
        </div>
        <div class="advanced_filters__arrows">
          <button type="button" class="advanced_filters__arrow advanced_filters__arrow--next" aria-label="Scroll filter options forward">
            <img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/forward-ico" alt="Arrow" />
          </button>
          <button type="button" class="advanced_filters__arrow advanced_filters__arrow--prev" aria-label="Scroll filter options backward">
            <img src="https://www.howdens.com/-/media/Images/2026/Enhanced-filters/forward-ico" alt="Arrow" />
          </button>
        </div>
      </div>
      <div class="advanced_filters__scrollbar-container">
        <div class="advanced_filters__scrollbar"></div>
      </div>
    </div>
  </main>

  <script src="./script.js" defer></script>
</body>

</html>
